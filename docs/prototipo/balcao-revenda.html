<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balcão Revenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu lateral claro + área de trabalho arejada em cartões; no celular o menu vira faixa rolável no topo */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f1f3f5; --ink:#1c2128; --muted:#687280; --line:#e7e9ee;
  --accent:#2b7a70; --accent-ink:#ffffff; --accent-soft:#e8f3f1;
  --good:#2e7d55; --good-soft:#e9f5ee; --warn:#9a6212; --warn-soft:#fbf3e4; --bad:#b54a40; --bad-soft:#fcecea;
  --shadow-s:0 1px 2px rgba(16,24,40,.04); --shadow:0 12px 40px rgba(16,24,40,.12);
  --scrim:rgba(16,20,26,.32);
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:8px; --r-m:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#181c21; --surface-2:#20252c; --ink:#e9ecf0; --muted:#9aa3ae; --line:#2a3038;
  --accent:#6cc3b6; --accent-ink:#0d1f1c; --accent-soft:#1c2f2c;
  --good:#6fcf9a; --good-soft:#17291f; --warn:#e3b065; --warn-soft:#2e2615; --bad:#ee8f86; --bad-soft:#331d1b;
  --shadow-s:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 40px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#181c21; --surface-2:#20252c; --ink:#e9ecf0; --muted:#9aa3ae; --line:#2a3038;
  --accent:#6cc3b6; --accent-ink:#0d1f1c; --accent-soft:#1c2f2c;
  --good:#6fcf9a; --good-soft:#17291f; --warn:#e3b065; --warn-soft:#2e2615; --bad:#ee8f86; --bad-soft:#331d1b;
  --shadow-s:0 1px 2px rgba(0,0,0,.3); --shadow:0 12px 40px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;padding-inline:10px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:inline-grid;place-items:center;color:var(--accent);font-style:normal;font-size:13px;font-weight:700}
.navtop,.navhead{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);font-size:14px;font-weight:650;color:var(--ink);letter-spacing:-.005em}
.navico{width:28px;height:28px;flex:none;border-radius:8px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.navico svg{width:16px;height:16px}
.navtop{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);font-size:14px;font-weight:650;color:var(--ink)}
.navtop:hover{background:var(--surface-2)}
.navtop[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navtop[aria-current="page"] .navico,.navgroup.on .navhead .navico{background:var(--accent);color:var(--accent-ink)}
.navgroup.on .navhead{color:var(--ink)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navsub{display:flex;flex-direction:column;gap:1px;margin-left:23px;padding-left:10px;border-left:1.5px solid var(--line)}
.navbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;white-space:nowrap;border-radius:var(--r-s);color:var(--muted);font-size:13.5px;font-weight:500;position:relative;transition:background .15s,color .15s}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-11.5px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--accent)}
.navbtn[aria-current="page"] small{color:var(--accent)}
.navtop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navbtn:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navbtn small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;background:var(--surface-2);padding:0 7px;border-radius:99px;line-height:18px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:10px;display:flex;flex-direction:column;gap:12px}
.themesw{display:flex;background:var(--surface-2);border-radius:var(--r-s);padding:3px;gap:2px}
.themesw button{all:unset;cursor:pointer;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.themesw button:hover{color:var(--ink)}
.themesw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.themesw button:focus-visible{outline:2px solid var(--accent)}
main{min-width:0;padding-block:32px 64px;padding-left:max(16px,min(4vw,44px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,44px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:24px}
.head h1{font-weight:600;font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-s);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-s);overflow:hidden}
.sect-title{font-weight:600;font-size:15px;margin:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel>header h2{font-weight:600;font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.panel .body{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kpis>.kpi{flex:1 1 170px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-s);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi>span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi>b{font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.drawer .kpi{box-shadow:none;background:var(--surface-2);border-color:transparent;padding:12px 14px}
.drawer .kpi>b{font-size:18px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap;width:1%}
.code{font-size:11.5px;font-weight:600;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);padding:2px 7px;border-radius:5px;white-space:nowrap}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pos{color:var(--good)} .neg{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.note{font-size:13px;padding:10px 14px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--warn);display:flex;gap:8px;line-height:1.45}
.note.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(1080px,100%)}
.drawer>header{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line)}
.drawer>header h2{font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em}
.drawer .dbody{padding:24px;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer>footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.split>*,.drawer .dbody>*,.stack>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.split.wl{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
@media (max-width:860px){.split,.split.wl{grid-template-columns:1fr}}
.picker{max-height:300px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:10px;padding:9px 20px;border-top:1px solid var(--line);cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .btn{box-shadow:none}
.lines .line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.lines .line:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.qty button{all:unset;cursor:pointer;width:28px;text-align:center;padding:4px 0;color:var(--muted)}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.ledger{display:flex;flex-direction:column}
.ledger .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ledger .row.total{border-bottom:0;margin-top:6px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2);font-weight:600;font-size:15px}
.ledger .row.sub{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 110px;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.bar .track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;opacity:.9}
.bar b{text-align:right;font-weight:600}
@media (max-width:480px){.bar{grid-template-columns:90px minmax(0,1fr) 90px}}
.split-strip{display:flex;gap:3px;height:10px}
.split-strip i{display:block;height:100%;border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
.compact td,.compact th{padding-inline:9px}
.iconrow{display:inline-flex;gap:6px;justify-content:flex-end}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn.sm{width:28px;height:28px}
.iconbtn.sm svg{width:14px;height:14px}
.iconbtn.armed,.iconbtn.danger.armed:hover{width:auto;padding:0 10px;background:var(--bad);border-color:var(--bad);color:#fff;font-size:12.5px;font-weight:600}
.split.eqsplit{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.eqsplit>.panel{display:flex;flex-direction:column}
.eqsplit>.panel>.body,.eqsplit>.panel>.platlist{flex:1}
@media (max-width:860px){.split.eqsplit{grid-template-columns:1fr}}
.destcards{display:flex;flex-wrap:wrap;gap:12px}
.destcard{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.dc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dc-name{display:inline-flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.dc-val{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dc-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}.dc-bar i{display:block;height:100%;border-radius:99px}
.dc-sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.dc-sub b{color:var(--ink);font-weight:600}
.destrow{display:grid;grid-template-columns:44px minmax(0,1fr) 84px 34px;gap:8px;align-items:center}
.platlist{display:flex;flex-direction:column}
.platrow{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
.platrow:last-child{border-bottom:0}
.pr-vals{display:grid;grid-template-columns:130px 110px;gap:16px;font-variant-numeric:tabular-nums}.pr-vals>div{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
@media (max-width:760px){.platrow{padding-inline:16px;flex-direction:column;align-items:flex-start}.pr-vals{display:grid;grid-template-columns:1fr 1fr;width:100%}.pr-vals>div{align-items:flex-start}.destrow{grid-template-columns:40px minmax(0,1fr) 62px 34px}}
.ptable td{vertical-align:top}
.abin{width:96px}.abin.sm{width:76px}
.abtable td{vertical-align:middle}
.ledger .row{flex-wrap:wrap}

.ptable .sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptable td.n .sub{justify-content:flex-end}
.ptable td.nw,.ptable td.main .sub{white-space:nowrap;flex-wrap:nowrap}
@media (max-width:1200px){
  .ptable thead{display:none}
  .ptable,.ptable tbody{display:block}
  .ptable tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .ptable td{padding:0;border:0;text-align:left!important}
  .ptable td.main{grid-column:1/-2;grid-row:1}
  .ptable td.n .sub{justify-content:flex-start}
  .ptable td[data-l]:not(.main):not(.act)::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
  .ptable td.act{grid-column:-2/-1;grid-row:1;justify-self:end;text-align:right!important;width:auto}
  .ptable td.act::before{display:none!important}
  .ptable tbody tr:hover td{background:transparent}
}@media (max-width:1380px){
  .ptable.wide thead{display:none}
  .ptable.wide,.ptable.wide tbody{display:block}
  .ptable.wide tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .ptable.wide td{padding:0;border:0;text-align:left!important}
  .ptable.wide td.main{grid-column:1/-2;grid-row:1}
  .ptable.wide td.n .sub{justify-content:flex-start}
  .ptable.wide td[data-l]:not(.main):not(.act)::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
  .ptable.wide td.act{grid-column:-2/-1;grid-row:1;justify-self:end;text-align:right!important;width:auto}
  .ptable.wide td.act::before{display:none!important}
  .ptable.wide tbody tr:hover td{background:transparent}
}

@media (max-width:600px){.ptable tr{grid-template-columns:1fr 1fr}}

.tierrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:var(--r-s);padding:3px;gap:2px}
.tabs button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted);border-radius:6px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.stack{display:flex;flex-direction:column;gap:16px}
.kitpill{background:var(--accent-soft)!important;color:var(--accent)!important}
input[type=color]{padding:3px;height:38px;cursor:pointer}
/* barra do topo: só aparece em telas estreitas */
.topbar{display:none}
.navscrim{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  nav.rail{padding-right:12px}
  main{padding-left:28px;padding-right:max(20px,env(safe-area-inset-right,0px))}
}
@media (max-width:860px){
  .split>.stack[style*="sticky"]{position:static!important}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}

  h+=`</div><div class="rail-foot"><div class="themesw" role="group" aria-label="Tema">${[['claro','Claro',ICON.sun],['escuro','Escuro',ICON.moon],['auto','Auto',ICON.auto]].map(([v,l,ic])=>`<button data-act="tema" data-t="${v}" aria-pressed="${TEMA===v}" title="Tema ${l.toLowerCase()}">${ic}<span>${l}</span></button>`).join('')}</div><div>Protótipo · dados salvos neste navegador</div></div>`;
  document.getElementById('rail').innerHTML=h;
}

const platPill=id=>{const p=plat(id);return p?`<span class="pill"><i class="dot" style="background:${esc(p.cor)}"></i>${esc(p.nome)}</span>`:'<span class="pill">—</span>'};
const head=(t,p,a='')=>`<div class="head"><div><h1>${t}</h1>${p?`<p>${p}</p>`:''}</div><div class="actions">${a}</div></div>`;
const ib=(act,attrs,label,icon,cls='')=>`<button class="iconbtn ${cls}" data-act="${act}" ${attrs} aria-label="${label}" title="${label}">${ICON[icon]}</button>`;
const delBtn=(kind,id,label='Excluir')=>ib('del',`data-k="${kind}" data-id="${id}"`,label,'trash','danger');
const actCell=inner=>`<td class="act" data-l="Ações"><div class="iconrow">${inner}</div></td>`;

const V={};
V.painel=()=>{
  const now=today().slice(0,7);
  const peds=ativos().filter(o=>UI.periodo==='tudo'||o.data.slice(0,7)===now);
  let fat=0,tx=0,liq=0,cus=0,luc=0;const porPlat={};const topo={};
  peds.forEach(o=>{const c=pedCalc(o);fat+=c.preco;tx+=c.taxaReal;liq+=c.liq;cus+=c.custo;luc+=c.lucro;
    const b=porPlat[o.plataforma]||(porPlat[o.plataforma]={fat:0,liq:0,n:0});b.fat+=c.preco;b.liq+=c.liq;b.n++;
    o.linhas.forEach(l=>{const k=l.tipo+l.ref;topo[k]=topo[k]||{nome:linhaNome(l),q:0};topo[k].q+=l.qtd})});
  const maxF=Math.max(1,...Object.values(porPlat).map(b=>b.fat));
  const sacado=S.saques.reduce((a,s)=>a+num(s.valor),0);
  const alerts=[];
  if(Math.abs(somaPct()-100)>0.01)alerts.push(['bad',`Os destinos do caixa somam ${somaPct()}%. Ajuste para 100% em Caixa e saques.`]);
  S.kits.forEach(k=>{const rs=S.plataformas.map(p=>({p,c:kitCalc(k,p.id)}));const neg=rs.filter(r=>r.c.lucro<0),low=rs.filter(r=>r.c.lucro>=0&&r.c.margem<0.15);
    if(neg.length)alerts.push(['bad',`“${esc(k.nome)}” dá prejuízo em ${neg.map(r=>`${esc(r.p.nome)} (mín. ${brl(r.c.minimo)})`).join(', ')}.`]);
    if(low.length)alerts.push(['warn',`“${esc(k.nome)}” tem margem baixa em ${low.map(r=>`${esc(r.p.nome)} (${pc(r.c.margem)})`).join(', ')}.`])});
  S.produtos.filter(p=>p.estoqueMin>0&&p.estoque<=p.estoqueMin).forEach(p=>alerts.push(['warn',`Estoque baixo: ${esc(p.nome)} (${p.estoque} ${esc(p.unidade)})`]));
  const dups=dupCodes();if(dups.length)alerts.push(['warn',`Códigos repetidos no cadastro: ${dups.map(esc).join(', ')}. Cada código deve ser único.`]);
  const top=Object.values(topo).sort((a,b)=>b.q-a.q).slice(0,6);
  return head('Painel','Resumo das vendas lançadas, do dinheiro sacado e dos pontos de atenção.',
    `<div class="tabs" role="group" aria-label="Período"><button data-act="periodo" data-p="mes" aria-pressed="${UI.periodo==='mes'}">Este mês</button><button data-act="periodo" data-p="tudo" aria-pressed="${UI.periodo==='tudo'}">Todo o período</button></div><button class="btn primary" data-act="novoPedido">Novo pedido</button>`)+
  `<div class="kpis">
    <div class="kpi"><span>Faturamento</span><b>${brl(fat)}</b><em>${peds.length} pedido(s)</em></div>
    <div class="kpi"><span>Taxas das plataformas</span><b>${brl(tx)}</b><em>${pc(fat?tx/fat:NaN)} do faturamento</em></div>
    <div class="kpi"><span>Líquido recebido</span><b>${brl(liq)}</b><em>vai para a carteira</em></div>
    <div class="kpi"><span>Custo dos pedidos</span><b>${brl(cus)}</b><em>produto + embalagem</em></div>
    <div class="kpi"><span>Lucro</span><b class="${luc<0?'neg':''}">${brl(luc)}</b><em>margem ${pc(fat?luc/fat:NaN)}</em></div>
  </div>
  <div class="grid g2">
    <section class="panel"><header><h2>Vendas por plataforma</h2><span class="muted">bruto · líquido</span></header><div class="body">
      ${Object.keys(porPlat).length?`<div class="bars">${Object.entries(porPlat).map(([id,b])=>`<div class="bar"><span>${esc(plat(id)?.nome||id)}</span><div class="track"><div class="fill" style="width:${b.fat/maxF*100}%;background:${esc(plat(id)?.cor||'var(--accent)')}"></div></div><b>${brl(b.fat)}<br><span class="muted" style="font-weight:400;font-size:12px">${brl(b.liq)} líq.</span></b></div>`).join('')}</div>`:'<div class="empty">Nenhum pedido no período.</div>'}
    </div></section>
    <section class="panel"><header><h2>Pontos de atenção</h2><span class="pill ${alerts.length?'warn':'good'}">${alerts.length||'Tudo certo'}</span></header><div class="body stack" style="gap:8px">
      ${alerts.length?alerts.map(([t,m])=>`<div class="note ${t==='bad'?'':''}" style="${t==='bad'?'background:var(--bad-soft);color:var(--bad)':''}">${m}</div>`).join(''):'<div class="empty">Nenhum alerta.</div>'}
    </div></section>
    <section class="panel"><header><h2>Caixa por destino</h2><button class="btn sm" data-act="go" data-v="caixa">Abrir caixa</button></header><div class="body">
      <div class="ledger">${S.destinos.map(d=>{const s=destSaldo(d.id);return `<div class="row"><span><i class="dot" style="background:${esc(d.cor)}"></i> ${esc(d.nome)} <span class="muted">${d.pct}%</span></span><b class="${s.saldo<0?'neg':''}">${brl(s.saldo)}</b></div>`}).join('')}
      <div class="row total"><span>Total sacado das plataformas</span><span>${brl(sacado)}</span></div></div>
    </div></section>
    <section class="panel"><header><h2>Itens mais vendidos</h2></header>
      ${top.length?`<div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Unid.</th></tr></thead><tbody>${top.map(t=>`<tr><td>${esc(t.nome)}</td><td class="n">${t.q}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem vendas.</div>'}
    </section>
  </div>`;
};
function dupCodes(){const m={};S.produtos.forEach(p=>m[p.codigo]=(m[p.codigo]||0)+1);return Object.keys(m).filter(k=>m[k]>1)}

  </tbody></table></section>`;
};

  const P=S.plataformas;
  return head('Composição de custo','Cadastre o produto de venda uma vez. O custo é o mesmo em todo lugar e o sistema calcula taxa, líquido e lucro em cada plataforma configurada. Na hora do pedido, basta escolher a plataforma.',`<button class="btn primary" data-act="editKit">Novo produto de venda</button>`)+

V.caixa=()=>{
  const sp=somaPct(), ok=Math.abs(sp-100)<0.01;
  const liqPlat={};ativos().forEach(o=>liqPlat[o.plataforma]=(liqPlat[o.plataforma]||0)+pedCalc(o).liq);
  const saqPlat={};S.saques.forEach(s=>saqPlat[s.plataforma]=(saqPlat[s.plataforma]||0)+num(s.valor));
  const ext=[...S.saques.map(s=>({data:s.data,tipo:'Saque',desc:`Saque ${plat(s.plataforma)?.nome||''}`,valor:num(s.valor),rateio:saqueRateio(s),id:s.id,k:'saques'})),
    ...S.investimentos.filter(i=>i.destino).map(i=>({data:i.data,tipo:'Investimento',desc:i.distribuidor,valor:-num(i.valor),d:i.destino})),
    ...S.compras.filter(c=>c.destino).map(c=>({data:c.data,tipo:'Insumo',desc:c.produto,valor:-num(c.valor),d:c.destino})),
    ...S.movimentos.map(m=>({data:m.data,tipo:'Retirada',desc:m.descricao,valor:-num(m.valor),d:m.destino,id:m.id,k:'movimentos'}))].sort((a,b)=>b.data.localeCompare(a.data));
  const saldos=S.destinos.map(d=>({d,...destSaldo(d.id)}));
  const totEnt=saldos.reduce((a,x)=>a+x.ent,0), totSai=saldos.reduce((a,x)=>a+x.sai,0), totSaldo=totEnt-totSai;
  const sacado=S.saques.reduce((a,x)=>a+num(x.valor),0);
  return head('Caixa e saques','Cada saque das plataformas é dividido automaticamente entre os destinos pelos percentuais configurados. Compras, investimentos e retiradas saem do destino escolhido.',
    `<button class="btn" data-act="editMov">Registrar retirada</button><button class="btn primary" data-act="editSaque">Registrar saque</button>`)+
  `<div class="kpis">
    <div class="kpi"><span>Sacado das plataformas</span><b>${brl(sacado)}</b><em>${S.saques.length} saque(s)</em></div>
    <div class="kpi"><span>Saídas do caixa</span><b>${brl(totSai)}</b><em>compras, investimentos e retiradas</em></div>
    <div class="kpi"><span>Saldo em caixa</span><b class="${totSaldo<0?'neg':''}">${brl(totSaldo)}</b><em>soma de todos os destinos</em></div>
  </div>
  <section class="panel" style="margin-bottom:16px"><header><h2>Saldo por destino</h2><span class="pill ${ok?'good':'bad'}">${ok?'Rateio fecha 100%':`Rateio soma ${sp}%`}</span></header>
    <div class="body"><div class="destcards">${saldos.map(x=>`<div class="destcard">

        <div class="pr-vals"><div><span class="hint">Líquido dos pedidos</span><b>${brl(l)}</b></div><div><span class="hint">Sacado</span><b>${brl(sq)}</b></div></div></div>`}).join('')}</div>

V.abelinhas=()=>{
  const fs=S.config.abelinhas, v=num(S.config.valorAbelinha);
  const ord=fs.map((f,i)=>({...f,i})).sort((a,b)=>num(a.ate)-num(b.ate));
  const fmtQ=q=>num(q).toLocaleString('pt-BR',{maximumFractionDigits:2});
  let prev=null;
  const rows=ord.map(f=>{const q=num(f.qtd),max=num(f.ate),min=prev==null?0:R(prev+0.01);const txt=prev==null?`até ${brl(max)}`:`${brl(min)} a ${brl(max)}`;prev=max;
    const ps=S.produtos.filter(p=>{const c=num(p.custo);return c>=min&&c<=max&&c>0});
    const venda=q*v, roiMed=ps.length?ps.reduce((a,p)=>a+(venda-num(p.custo))/num(p.custo),0)/ps.length:NaN;
    const eqMax=q?max/q:NaN, eqMin=q?Math.max(min,0.01)/q:NaN, roiPior=max?(venda-max)/max:NaN;
    let st,cls;if(venda>max+0.004){st='Lucro';cls='good'}else if(Math.abs(venda-max)<=0.004){st='Empata no teto';cls='warn'}else if(venda>min){st=`Prejuízo > ${brl(venda)}`;cls='warn'}else{st='Prejuízo';cls='bad'}
    return {...f,q,max,min,txt,ps,venda,roiMed,eqMax,eqMin,roiPior,st,cls}});
  // análise geral (produtos reais)
  const comQ=S.produtos.filter(p=>num(p.custo)>0).map(p=>{const q=abProd(p);return {p,q,need:q?num(p.custo)/q:Infinity,roi:q?(q*v-num(p.custo))/num(p.custo):NaN}});
  const lucro=comQ.filter(x=>x.roi>=0).length, prej=comQ.length-lucro, roiGeral=comQ.length?comQ.reduce((a,x)=>a+x.roi,0)/comQ.length:NaN;
  const needMax=Math.max(...comQ.map(x=>x.need)), needMin=Math.min(...comQ.map(x=>x.need));
  const tabMax=rows.reduce((m,r)=>r.eqMax>m.eqMax?r:m,rows[0]||{eqMax:0});
  const best=rows.filter(r=>isFinite(r.roiMed)).reduce((m,r)=>!m||r.roiMed>m.roiMed?r:m,null);
  const worst=rows.filter(r=>isFinite(r.roiMed)).reduce((m,r)=>!m||r.roiMed<m.roiMed?r:m,null);
  const exP=comQ.filter(x=>isFinite(x.roi)).reduce((m,x)=>!m||Math.abs(x.roi-roiGeral)<Math.abs(m.roi-roiGeral)?x:m,null);
  const topP=comQ.reduce((m,x)=>!m||x.roi>m.roi?x:m,null), lowP=comQ.reduce((m,x)=>!m||x.roi<m.roi?x:m,null);
  const roiCell=r=>isFinite(r)?`<span class="${r<-0.0005?'neg':r>0.0005?'pos':'muted'}"><b>${pc(r)}</b></span>`:'<span class="muted">—</span>';
  return head('Regra de abelinhas','Define quantas abelinhas cada produto vale de acordo com o custo de compra. Ao cadastrar ou editar um produto, o valor é calculado sozinho por esta tabela.',
    `<label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)">Valor de 1 🐝 (R$)<input type="text" inputmode="decimal" id="vab" value="${esc(String(S.config.valorAbelinha).replace('.',','))}" data-cfg="valorAbelinha" style="width:96px" autocomplete="off"></label><button class="btn primary" data-act="addAb">Adicionar faixa</button>`)+
  `<div class="kpis">
    <div class="kpi" style="flex:2.4 1 380px"><span>ROI médio dos produtos</span><b class="${roiGeral<0?'neg':''}">${pc(roiGeral)}</b><em>com 1 🐝 = ${brl(v)}</em>
      ${isFinite(roiGeral)?`<div style="margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--muted);display:flex;flex-direction:column;gap:6px">
        <span style="color:var(--ink)"><b>Como ler:</b> ${roiGeral>=0?`para cada R$ 1,00 gasto na compra, volta em média <b>${brl(1+roiGeral)}</b>: o R$ 1,00 investido mais <b>${brl(roiGeral)}</b> de lucro.`:`para cada R$ 1,00 gasto na compra, volta em média só <b>${brl(1+roiGeral)}</b>: prejuízo de <b>${brl(-roiGeral)}</b> por real investido.`}</span>
        ${exP?`<span><b style="color:var(--ink)">Exemplo:</b> ${esc(exP.p.nome)} custa ${brl(exP.p.custo)} e vale ${fmtQ(exP.q)} 🐝 × ${brl(v)} = ${brl(exP.q*v)}. ${exP.q*v-num(exP.p.custo)>=0?'Lucro':'Prejuízo'} de ${brl(Math.abs(exP.q*v-num(exP.p.custo)))}. ROI = ${brl(exP.q*v-num(exP.p.custo))} ÷ ${brl(exP.p.custo)} = <b style="color:var(--ink)">${pc(exP.roi)}</b>.</span>`:''}
        <span>O ROI médio é a média do ROI de cada produto: itens baratos com muitas abelinhas puxam a média para cima.</span>
      </div>`:''}</div>
    <div class="kpi"><span>Produtos com lucro</span><b>${lucro}</b><em>de ${comQ.length}</em></div>
    <div class="kpi"><span>Produtos com prejuízo</span><b class="${prej?'neg':''}">${prej}</b><em>${prej?'veja a coluna Situação':'nenhum'}</em></div>
    <div class="kpi"><span>🐝 mínima sem prejuízo</span><b>${isFinite(needMax)?brl(needMax):'—'}</b><em>para todos os produtos atuais</em></div>
  </div>
  <div class="stack">
  <section class="panel"><header><h2>Faixas por custo de compra</h2><span class="muted">ROI = (abelinhas × valor da 🐝 − custo) ÷ custo</span></header>
  <table class="ptable wide abtable"><thead><tr><th>Faixa de custo</th><th>Custo até (R$)</th><th>Abelinhas</th><th class="n">Venda em R$</th><th class="n">ROI médio</th><th class="n">ROI no limite</th><th class="n">🐝 mínima p/ lucro</th><th class="n">Ações</th></tr></thead><tbody>
  ${rows.map(r=>`<tr>
    <td class="main" data-l="Faixa"><b style="font-weight:600;white-space:nowrap">${r.txt}</b><div class="sub"><span class="pill ${r.cls}">${r.st}</span><span>${r.ps.length} produto(s)</span></div></td>
    <td data-l="Custo até (R$)"><input type="number" step="0.01" value="${esc(r.ate)}" data-ab="${r.i}" data-f="ate" aria-label="Custo até" class="abin"></td>
    <td data-l="Abelinhas"><input type="number" step="0.5" value="${esc(r.qtd)}" data-ab="${r.i}" data-f="qtd" aria-label="Abelinhas" class="abin sm"></td>
    <td class="n" data-l="Venda em R$">${brl(r.venda)}</td>
    <td class="n" data-l="ROI médio">${roiCell(r.roiMed)}</td>
    <td class="n" data-l="ROI no limite">${roiCell(r.roiPior)}</td>
    <td class="n" data-l="🐝 mínima p/ lucro" title="Valor que 1 abelinha precisa ter para o produto mais caro da faixa não dar prejuízo">${isFinite(r.eqMax)?brl(r.eqMax):'—'}</td>
    ${actCell(ib('delAb',`data-i="${r.i}"`,'Remover faixa','trash','danger'))}</tr>`).join('')}
  </tbody></table>
  <div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0"><span class="hint">ROI médio: média dos produtos cadastrados na faixa. ROI no limite: produto que custa exatamente o teto da faixa (o pior caso). Não inclui embalagem, impressão nem taxas de plataforma.</span></div></section>

  <section class="panel"><header><h2>Quando dá lucro e quando dá prejuízo</h2></header><div class="body stack" style="gap:12px">
    <div class="ledger">
      <div class="row"><span>1 🐝 abaixo de <b>${isFinite(needMin)?brl(needMin):'—'}</b></span><span class="pill bad">Todos os produtos dão prejuízo</span></div>
      <div class="row"><span>1 🐝 entre <b>${isFinite(needMin)?brl(needMin):'—'}</b> e <b>${isFinite(needMax)?brl(needMax):'—'}</b></span><span class="pill warn">Parte dá lucro, parte dá prejuízo</span></div>
      <div class="row"><span>1 🐝 a partir de <b>${isFinite(needMax)?brl(needMax):'—'}</b></span><span class="pill good">Todos os produtos dão lucro</span></div>
    </div>
    <p style="margin:0">Pela tabela, a faixa mais exigente é <b>${tabMax?tabMax.txt:'—'}</b>: ${tabMax?`${fmtQ(tabMax.q)} 🐝 para um custo de até ${brl(tabMax.max)}, então a 🐝 precisa valer pelo menos <b>${brl(tabMax.eqMax)}</b> para nenhum produto dessa faixa dar prejuízo`:''}. Nas outras faixas o teto é ${rows.filter(r=>r!==tabMax).map(r=>brl(r.eqMax)).filter((x,i,a)=>a.indexOf(x)===i).join(', ')}.</p>
    <p style="margin:0">Com 1 🐝 = <b>${brl(v)}</b>: ${best?`a faixa com maior lucro é <b>${best.txt}</b> (ROI médio ${pc(best.roiMed)})`:''}${worst&&worst!==best?` e a de menor lucro é <b>${worst.txt}</b> (${pc(worst.roiMed)})`:''}.</p>
    <p style="margin:0">${topP?`Maior ROI: <b>${esc(topP.p.nome)}</b> (${brl(topP.p.custo)} → ${fmtQ(topP.q)} 🐝 = ${brl(topP.q*v)}, ROI ${pc(topP.roi)}).`:''} ${lowP?`Menor ROI: <b>${esc(lowP.p.nome)}</b> (${brl(lowP.p.custo)} → ${fmtQ(lowP.q)} 🐝 = ${brl(lowP.q*v)}, ROI ${pc(lowP.roi)}).`:''}</p>
    <p style="margin:0" class="muted">Dentro de cada faixa, quanto mais barato o produto em relação ao teto, maior o lucro. O produto que custa exatamente o teto da faixa é o que tem a menor margem. Custos acima da última faixa usam o valor da última.</p>
  </div></section></div>`;
};

/* ---------- formulários simples ---------- */
const FORMS={
  produtos:{title:'Produto',fields:[['codigo','Código','text'],['nome','Nome do produto','text',1],['marca','Marca','text'],['categoria','Categoria','text'],['fornecedor','Fornecedor','text'],['custo','Custo unitário (R$)','number'],['unidade','Unidade','text'],['estoque','Estoque atual','number'],['ean','Código de barras (EAN)','text'],['ativo','Situação','sel',0,[['true','Ativo'],['false','Inativo']]],['obs','Observações','text',1]],blank:()=>({codigo:'',nome:'',marca:'',categoria:'Cosméticos',fornecedor:'',custo:0,unidade:'un',estoque:0,estoqueMin:0,ean:'',ativo:true,obs:''})},
  compras:{title:'Compra de insumo',fields:[['data','Data','date'],['tipo','Tipo','sel',0,['Embalagem','Etiqueta','Impressão','Fita / lacre','Brinde','Outros']],['produto','Produto','text',1],['descricao','Descrição / medida','text'],['valor','Valor da compra (R$)','number'],['pacotes','Quantidade (pacotes)','number'],['itens','Total de itens','number'],['destino','Pago com (destino do caixa)','dest']],blank:()=>({data:today(),tipo:'Embalagem',produto:'',descricao:'',valor:0,pacotes:1,itens:1,destino:''})},
  investimentos:{title:'Investimento',fields:[['data','Data','date'],['distribuidor','Distribuidor','text'],['valor','Valor (R$)','number'],['nf','Nota / nº do pedido','text'],['destino','Pago com (destino do caixa)','dest'],['obs','Observação','text',1]],blank:()=>({data:today(),distribuidor:'',valor:0,nf:'',destino:S.destinos.find(d=>/compra/i.test(d.nome))?.id||'',obs:''})},
  saques:{title:'Saque da plataforma',fields:[['data','Data','date'],['plataforma','Plataforma','plat'],['valor','Valor sacado (R$)','number'],['obs','Observação','text',1]],blank:()=>({data:today(),plataforma:S.plataformas[0]?.id,valor:0,obs:''})},
  movimentos:{title:'Retirada do caixa',fields:[['data','Data','date'],['destino','Destino','dest'],['valor','Valor (R$)','number'],['descricao','Descrição','text',1]],blank:()=>({data:today(),destino:S.destinos[0]?.id,valor:0,descricao:''})}
};
let EDIT=null;
function openForm(kind,id){
  const F=FORMS[kind], rec=id?{...S[kind].find(r=>r.id===id)}:F.blank();EDIT={kind,id,rec};
  const input=([k,l,t,full,opts])=>{const v=rec[k];let el;
    if(t==='sel')el=`<select id="f_${k}">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(t==='dest')el=`<select id="f_${k}"><option value="">— não descontar do caixa —</option>${S.destinos.map(d=>`<option value="${d.id}" ${v===d.id?'selected':''}>${esc(d.nome)}</option>`).join('')}</select>`;
    else if(t==='plat')el=`<select id="f_${k}">${S.plataformas.map(d=>`<option value="${d.id}" ${v===d.id?'selected':''}>${esc(d.nome)}</option>`).join('')}</select>`;
    else el=`<input id="f_${k}" type="${t}" ${t==='number'?'step="0.01"':''} value="${esc(v)}" ${CASE[kind]?.[k]?`data-case="${CASE[kind][k]}"`:''}>`;
    return `<label class="f ${full?'full':''}">${l}${el}</label>`};
  let extra='';
  if(kind==='saques')extra=`<div class="panel"><div class="body"><div class="sect-title" style="margin-bottom:8px">Rateio automático</div><div class="ledger" id="rateio"></div></div></div>`;

    <div id="abEditRow" ${EDIT.abEdit?'':'hidden'} style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><label class="f" style="flex:0 1 160px">Abelinhas deste produto<input id="f_abOverride" type="text" inputmode="decimal" autocomplete="off" value="${esc(hasOv(rec)?String(rec.abOverride).replace('.',','):'')}"></label><button class="btn sm" data-act="abReset">Voltar para a regra</button></div>
    <div id="abMsg" class="stack" style="gap:8px"></div></div></section>`}

function liveForm(){if(!EDIT||!FORMS[EDIT.kind])return;const g=k=>document.getElementById('f_'+k)?.value;
  if(EDIT.kind==='saques'){const v=num(g('valor'));document.getElementById('rateio').innerHTML=S.destinos.map(d=>`<div class="row"><span><i class="dot" style="background:${esc(d.cor)}"></i> ${esc(d.nome)} <span class="muted">${d.pct}%</span></span><b>${brl(v*d.pct/100)}</b></div>`).join('')+`<div class="row total"><span>Total</span><span>${brl(v*somaPct()/100)}</span></div>`+(Math.abs(somaPct()-100)>.01?`<div class="note" style="margin-top:8px">Os destinos somam ${somaPct()}%: ${brl(v*(100-somaPct())/100)} ficaria sem destino.</div>`:'')}
  if(EDIT.kind==='produtos')abBox();
  if(EDIT.kind==='compras'){const v=num(g('valor')),i=num(g('itens'));document.getElementById('unit').textContent=`Valor unitário: ${brl(i?v/i:0)} por item`}
}
function abBox(){
  const c=num(document.getElementById('f_custo')?.value), rule=abelinhas(c), R0=rule.qtd, v=num(S.config.valorAbelinha);
  const inp=document.getElementById('f_abOverride'), raw=inp?inp.value.trim():'', manual=EDIT.abEdit&&raw!=='';
  const O=manual?num(raw):R0;
  document.getElementById('abEditRow').hidden=!EDIT.abEdit;
  document.getElementById('abEditBtn').hidden=!!EDIT.abEdit;
  document.getElementById('abVal').textContent=abN(O);
  document.getElementById('abSub').textContent=manual&&O!==R0?`Ajustado manualmente · pela regra seria ${abN(R0)}`:`Calculado pela regra (custo ${brl(c)})${rule.acima?' · acima da última faixa':''}`;
  const box=document.getElementById('abMsg');
  if(!manual||O===R0||!c){box.innerHTML='';return}
  const dif=O-R0, difPct=R0?dif/R0:0, roiR=(R0*v-c)/c, roiO=(O*v-c)/c, lucroO=O*v-c, minAb=Math.ceil((c/v)*2)/2;
  const id=EDIT.id, kits=id?S.kits.filter(k=>k.itens.some(i=>i.pid===id)):[];
  const peds=id?S.pedidos.filter(o=>o.linhas.some(l=>(l.tipo==='p'&&l.ref===id)||(l.tipo==='k'&&kit(l.ref)?.itens.some(i=>i.pid===id)))).length:0;
  const msgs=[];let cls,tit;
  if(lucroO<0){cls='bad';tit=`Com ${abN(O)} este produto passa a dar prejuízo.`}
  else if(difPct<=-0.5){cls='bad';tit=`Muito abaixo da regra: ${abN(Math.abs(dif))} a menos (${pc(difPct)}).`}
  else if(dif<0){cls='warn';tit=`Abaixo da regra: ${abN(Math.abs(dif))} a menos (${pc(difPct)}). Bom para promoção, com lucro menor.`}
  else{cls='good';tit=`Acima da regra: ${abN(dif)} a mais (+${pc(difPct).replace('-','')}). Lucro maior por unidade.`}
  msgs.push(`<b>${tit}</b>`);
  msgs.push(`Com 1 🐝 = ${brl(v)}: vende por ${brl(O*v)} em vez de ${brl(R0*v)}. ${lucroO>=0?'Lucro':'Prejuízo'} de ${brl(Math.abs(lucroO))} por unidade (antes ${brl(R0*v-c)}). ROI vai de ${pc(roiR)} para ${pc(roiO)}.`);
  if(dif<0)msgs.push(`Para não ter prejuízo, este produto precisa de pelo menos ${abN(minAb)}.`);
  if(dif<0&&lucroO>=0&&R0*v-c>0)msgs.push(`Para manter o mesmo lucro total, você precisaria vender ${((R0*v-c)/lucroO).toLocaleString('pt-BR',{maximumFractionDigits:1})}× mais unidades.`);
  if(kits.length)msgs.push(`Kits afetados: ${kits.map(k=>{const q=k.itens.find(i=>i.pid===id).qtd;return `${esc(k.nome)} (${abN(abItens(k.itens))} → ${abN(abItens(k.itens)+(O-abProd(prod(id)))*q)})`}).join(', ')}.`);
  if(peds)msgs.push(`${peds} pedido(s) já lançado(s) com este produto vão mostrar o novo total de abelinhas.`);
  if(dif>0)msgs.push('Confira se o cliente aceita pagar mais abelinhas por este item.');
  box.innerHTML=`<div class="note" style="${cls==='bad'?'background:var(--bad-soft);color:var(--bad)':cls==='good'?'background:var(--good-soft);color:var(--good)':''};flex-direction:column;gap:4px">${msgs.map(m=>`<span>${m}</span>`).join('')}</div>`;
}
function saveForm(){const F=FORMS[EDIT.kind],r=EDIT.rec;
  F.fields.forEach(([k,,t])=>{let v=document.getElementById('f_'+k).value;if(t==='number')v=num(v);if(k==='ativo')v=v==='true';if(CASE[EDIT.kind]?.[k])v=FMT[CASE[EDIT.kind][k]](v);r[k]=v});

    r.abOverride=EDIT.abEdit&&raw!==''&&num(raw)!==rq?num(raw):null;r.abelinha=r.abOverride??rq}
  if(EDIT.kind==='saques'&&!EDIT.id)r.rateio=S.destinos.map(d=>({d:d.id,pct:num(d.pct)}));

}

  if(!D._auto)return;const ks=D.linhas.filter(l=>l.tipo==='k'&&kit(l.ref));if(!ks.length)return;
  D.preco=R(ks.reduce((s,l)=>s+kitCalc(kit(l.ref),D.plataforma).M*l.qtd,0));D.anuncios=ks.reduce((s,l)=>s+l.qtd,0);
  const a=document.getElementById('o_preco'),b=document.getElementById('o_anuncios');if(a)a.value=D.preco;if(b)b.value=D.anuncios}
function pedRender(){autoPreco();
  document.getElementById('o_lines').innerHTML=D.linhas.length?D.linhas.map((l,ix)=>`<div class="line"><div style="min-width:0">${l.tipo==='k'?'<span class="pill kitpill">kit</span>':`<span class="code">${esc(prod(l.ref)?.codigo)}</span>`} ${esc(linhaNome(l))}<div class="muted" style="font-size:12px">${abN(abLinha(l))} cada${l.qtd>1?` · ${abN(abLinha(l)*l.qtd)} no total`:''}${l.tipo==='k'&&kit(l.ref)?` · ${kit(l.ref).itens.map(i=>`${i.qtd}× ${esc(prod(i.pid)?.codigo||'?')} (${abN(abProd(prod(i.pid))*i.qtd)})`).join(' + ')}`:''}</div></div><span class="muted">${brl(linhaCusto(l))}</span><span class="qty"><button data-act="qty" data-i="${ix}" data-d="-1" aria-label="Diminuir">−</button><span>${l.qtd}</span><button data-act="qty" data-i="${ix}" data-d="1" aria-label="Aumentar">+</button></span><b style="min-width:76px;text-align:right">${brl(linhaCusto(l)*l.qtd)}</b></div>`).join(''):'<div class="empty">Adicione os itens que o cliente comprou.</div>';
  document.getElementById('o_pick').innerHTML=pickerHTML(D._q,true);pedSum();
}
function pedSum(){
  const c=pedCalc(D),pl=plat(D.plataforma),f=faixa(pl,c.preco);const row=(l,v,cls='')=>`<div class="row ${cls}"><span>${l}</span><span>${v}</span></div>`;
  const dif=c.real?c.liq-c.liqEst:0;const temKit=D.linhas.some(l=>l.tipo==='k');
  document.getElementById('o_sum').innerHTML=`<div class="sect-title">Custo do pedido</div>
  <div class="ledger" style="margin-top:6px">${row('Mercadoria',brl(c.merc))}${row('Embalagem + impressão + outros',brl(num(D.embalagem)+num(D.impressao)+num(D.outros)))}${row('Custo total',brl(c.custo),'total')}</div>
  <div class="sect-title" style="margin-top:14px">Abelinhas do pedido</div>
  <div class="ledger" style="margin-top:6px">${D.linhas.length?D.linhas.map(l=>row(`${esc(linhaNome(l))}${l.qtd>1?` × ${l.qtd}`:''}`,abN(abLinha(l)*l.qtd),'sub')).join(''):row('Nenhum item ainda','0 🐝','sub')}
  ${row('<b>Total de abelinhas</b>',`<b>${abN(abPedido(D))}</b>`)}${row(`Valem com 1 🐝 = ${brl(num(S.config.valorAbelinha))}`,brl(abPedido(D)*num(S.config.valorAbelinha)),'sub')}</div>
  <div class="sect-title" style="margin-top:14px">Venda</div>
  <div class="ledger" style="margin-top:6px">${row('Preço de venda',brl(c.preco))}${row(`Taxa estimada ${esc(pl?.nome||'')} (${f.pct}% + ${brl(f.fixo)}${num(D.anuncios)>1?' × '+num(D.anuncios):''})`,brl(c.tEst),'sub')}${row('Líquido estimado',brl(c.liqEst),'sub')}
  ${row('Líquido considerado',`${brl(c.liq)} ${c.real?'<span class="pill good">informado</span>':'<span class="pill">estimado</span>'}`)}${row('Taxa efetiva',`${brl(c.taxaReal)} · ${pc(c.preco?c.taxaReal/c.preco:NaN)}`,'sub')}
  <div class="row total"><span>Lucro do pedido</span><span class="${c.lucro<0?'neg':'pos'}">${brl(c.lucro)}</span></div></div>
  <p class="hint">Margem sobre a venda: ${pc(c.margem)}</p>
  ${D._auto&&temKit?`<div class="note info">Preço preenchido com o valor do kit na ${esc(pl?.nome||'plataforma')}. Troque a plataforma e ele recalcula; digite outro preço se a venda foi diferente.</div>`:''}
  ${c.real&&Math.abs(dif)>0.5?`<div class="note">O líquido informado difere ${brl(dif)} da estimativa. Se for recorrente, revise as faixas em Plataformas e taxas.</div>`:''}`;
}
function savePed(){if(!String(D.cliente).trim()){toast('Informe o cliente ou nº do pedido');return}if(!D.linhas.length){toast('Adicione pelo menos um item');return}
  D.cliente=fmtMaius(D.cliente);if(D.obs)D.obs=fmtFrase(D.obs);const {_kind,_q,_auto,_env,...o}=D;if(o.id)Object.assign(S.pedidos.find(x=>x.id===o.id),o);else S.pedidos.push({...o,id:uid()});save();closeDrawer();render();toast('Pedido salvo')}

/* ---------- drawer ---------- */
function drawer(title,body,foot,wide){document.getElementById('layer').innerHTML=`<div class="scrim" data-act="scrim"><div class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn ghost" data-act="close" aria-label="Fechar">Fechar</button></header><div class="dbody">${body}</div><footer>${foot}</footer></div></div>`}
function closeDrawer(){document.getElementById('layer').innerHTML='';EDIT=null;D=null}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='scrim'){if(e.target===t)closeDrawer();return}
  if(a==='tema'){TEMA=t.dataset.t;try{localStorage.setItem('balcao-tema',TEMA)}catch(_){};aplicaTema();renderRail();toast(TEMA==='claro'?'Tema claro':TEMA==='escuro'?'Tema escuro':'Tema automático (segue o aparelho)');return}
  if(a==='menu'){document.body.classList.add('nav-open');return}
  if(a==='menuclose'){document.body.classList.remove('nav-open');return}
  if(a==='go'){document.body.classList.remove('nav-open');view=t.dataset.v;try{history.replaceState(null,'','#'+view)}catch(_){};render();window.scrollTo(0,0)}
  else if(a==='periodo'){UI.periodo=t.dataset.p;render()}
  else if(a==='close')closeDrawer();
  else if(a==='editProd'){openForm('produtos',t.dataset.id);if(t.dataset.ab==='edit'){document.querySelector('[data-act="abEdit"]')?.click()}}
  else if(a==='editCompra')openForm('compras',t.dataset.id);
  else if(a==='editInv')openForm('investimentos',t.dataset.id);
  else if(a==='editSaque')openForm('saques',t.dataset.id);
  else if(a==='editMov')openForm('movimentos');
  else if(a==='saveForm')saveForm();
  else if(a==='abEdit'){EDIT.abEdit=true;const i=document.getElementById('f_abOverride');if(i&&i.value==='')i.value=String(abelinhas(num(document.getElementById('f_custo').value)).qtd).replace('.',',');abBox();i&&i.focus()}
  else if(a==='abReset'){EDIT.abEdit=false;const i=document.getElementById('f_abOverride');if(i)i.value='';abBox()}
  else if(a==='editKit')openKit(t.dataset.id);
  else if(a==='dupKit'){const k=JSON.parse(JSON.stringify(kit(t.dataset.id)));k.id=uid();k.nome+=' (cópia)';k.vendidosIni={};S.kits.push(k);save();render();toast('Duplicado')}
  else if(a==='novoPedido')openPed();
  else if(a==='editPed')openPed(t.dataset.id);
  else if(a==='pickP'){const arr=D._kind==='kit'?D.itens:D.linhas;const key=D._kind==='kit'?'pid':'ref';const ex=arr.find(i=>i[key]===t.dataset.id&&(D._kind==='kit'||i.tipo==='p'));if(ex)ex.qtd++;else arr.push(D._kind==='kit'?{pid:t.dataset.id,qtd:1}:{tipo:'p',ref:t.dataset.id,qtd:1});D._kind==='kit'?kitRender():pedRender()}
  else if(a==='pickK'){const ex=D.linhas.find(i=>i.tipo==='k'&&i.ref===t.dataset.id);if(ex)ex.qtd++;else D.linhas.push({tipo:'k',ref:t.dataset.id,qtd:1});pedRender()}
  else if(a==='qty'){const arr=D._kind==='kit'?D.itens:D.linhas,i=+t.dataset.i;arr[i].qtd+=+t.dataset.d;if(arr[i].qtd<=0)arr.splice(i,1);D._kind==='kit'?kitRender():pedRender()}
  else if(a==='saveKit')saveKit();
  else if(a==='addAb'){const fs=S.config.abelinhas;const last=fs.reduce((m,f)=>Math.max(m,num(f.ate)),0);const lq=fs.reduce((m,f)=>Math.max(m,num(f.qtd)),0);fs.push({ate:R(last+4),qtd:lq+0.5});save();render()}
  else if(a==='delAb'){S.config.abelinhas.splice(+t.dataset.i,1);save();render()}
  else if(a==='usarSug'){const p=t.dataset.p;D.precos[p]=D.precos[p]||{};D.precos[p].preco=t.dataset.v;document.getElementById(`kp_${p}_preco_in`).value=t.dataset.v;kitSum()}
  else if(a==='savePed')savePed();
  else if(a==='del'){
    if(!t.classList.contains('armed')){t.classList.add('armed');t.dataset.html=t.innerHTML;t.textContent='Confirmar';setTimeout(()=>{if(t.isConnected){t.classList.remove('armed');t.innerHTML=t.dataset.html}},3000);return}
    const k=t.dataset.k,id=t.dataset.id;
    if(k==='plataformas'&&S.plataformas.length<=1){toast('Mantenha pelo menos uma plataforma');return}
    S[k]=S[k].filter(r=>r.id!==id);save();render();toast('Excluído')}
  else if(a==='addDest'){S.destinos.push({id:uid(),nome:'Novo destino',pct:0,cor:PALETTE[S.destinos.length%PALETTE.length]});save();render()}
  else if(a==='addPlat'){S.plataformas.push({id:uid(),nome:'Nova plataforma',cor:PALETTE[S.plataformas.length%PALETTE.length],obs:'',faixas:[{ate:null,fixo:0,pct:0}]});save();render()}
  else if(a==='addTier'){const p=plat(t.dataset.p);p.faixas.splice(Math.max(0,p.faixas.length-1),0,{ate:0,fixo:0,pct:0});save();render()}
  else if(a==='delTier'){const p=plat(t.dataset.p);if(p.faixas.length>1){p.faixas.splice(+t.dataset.i,1);save();render()}}
  else if(a==='copiar'){const txt=JSON.stringify(S);const ta=document.getElementById('json');navigator.clipboard?.writeText(txt).then(()=>toast('Backup copiado')).catch(()=>{ta.value=txt;ta.select();toast('Selecionado: copie com Ctrl+C')});if(!navigator.clipboard){ta.value=txt;ta.select()}}
  else if(a==='importar'){try{const o=JSON.parse(document.getElementById('json').value);if(!o.produtos)throw 0;S=o;save();render();toast('Dados importados')}catch(_){toast('Backup inválido: cole o JSON completo')}}
  else if(a==='reset'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Confirmar: apagar e restaurar';return}S=seed();normaliza();corrige();S.caseV=2;save();render();toast('Dados da planilha restaurados')}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.ui){UI[d.ui]=t.value;const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(d.kf!=null&&D){D[d.kf]=t.type==='number'?t.value:t.value;
    if(d.kf==='embInsumo'&&t.value){const c=S.compras.find(c=>c.id===t.value);D.embalagem=R(compraUnit(c));document.getElementById('k_embalagem').value=D.embalagem}
    if(d.kf==='embalagem')D.embInsumo='',document.getElementById('k_embInsumo').value='';
    kitSum();return}
  if(d.kp&&D){D.precos[d.kp]=D.precos[d.kp]||{};D.precos[d.kp][d.f]=t.value;kitSum();return}
  if(d.kq!=null&&D){D._q=t.value;document.getElementById('k_pick').innerHTML=pickerHTML(D._q,false);return}
  if(d.of!=null&&D){D[d.of]=t.value;if(d.of==='preco'||d.of==='anuncios')D._auto=false;if(['embalagem','impressao','outros'].includes(d.of))D._env=false;if(d.of==='plataforma')autoPreco();pedSum();return}
  if(d.oq!=null&&D){D._q=t.value;document.getElementById('o_pick').innerHTML=pickerHTML(D._q,true);return}
  if(t.id&&t.id.startsWith('f_')){liveForm();return}
  if(d.ab!=null&&d.ab!==undefined&&d.f){S.config.abelinhas[+d.ab][d.f]=num(t.value);save();return}
  if(d.cfg==='valorAbelinha'){S.config.valorAbelinha=num(t.value);save();clearTimeout(window._vab);
    window._vab=setTimeout(()=>{const raw=t.value,pos=t.selectionStart;render();const n=document.getElementById('vab');if(n){n.value=raw;n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},300);return}
  if(d.cfg){S.config[d.cfg]=num(t.value);save();return}
  if(d.dest){const x=dest(d.dest);x[d.f]=d.f==='pct'?num(t.value):t.value;save();return}
  if(d.plat){const p=plat(d.plat);if(d.tier!=null){p.faixas[+d.tier][d.f]=d.f==='ate'&&t.value===''?null:num(t.value)}else p[d.f]=t.value;save();return}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.case&&FMT[d.case]){const nv=FMT[d.case](e.target.value);if(nv!==e.target.value){e.target.value=nv;e.target.dispatchEvent(new Event('input',{bubbles:true}))}}
  if(d.dest&&d.f==='nome'){const x=dest(d.dest);x.nome=fmtFrase(e.target.value);save()}
  if(d.plat||d.dest||d.ab!=null)render()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.body.classList.contains('nav-open'))document.body.classList.remove('nav-open');else if(document.getElementById('layer').innerHTML)closeDrawer()});
render();
</script>
</body>
</html>
